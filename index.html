<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รับหรือรับ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Sarabun:wght@400;500&display=swap">
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  /* Layout: one centered card on a soft field; the "no" button escapes into the whole viewport */
  :root {
    --bg: #fbf3f1;
    --card: #ffffff;
    --ink: #2b2226;
    --ink-soft: #7a6a70;
    --yes: #e2506f;
    --yes-ink: #ffffff;
    --no: #ece3e5;
    --no-ink: #5c4d52;
    --line: #f0e2e5;
    --font-display: "Mitr", "Sarabun", system-ui, sans-serif;
    --font-body: "Sarabun", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1618; --card: #261e21; --ink: #f6eaed; --ink-soft: #b7a3aa;
      --yes: #f06a87; --yes-ink: #1c1618; --no: #3a2f33; --no-ink: #e3d4d9; --line: #3a2f33;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1618; --card: #261e21; --ink: #f6eaed; --ink-soft: #b7a3aa;
    --yes: #f06a87; --yes-ink: #1c1618; --no: #3a2f33; --no-ink: #e3d4d9; --line: #3a2f33;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    display: grid; place-items: center; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px; box-sizing: border-box;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    width: min(440px, 100%); padding: 40px 28px; box-sizing: border-box;
    text-align: center; display: grid; gap: 20px; justify-items: center;
  }
  .heart { width: 72px; height: 72px; }
  .heart path { fill: var(--yes); }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 6vw, 34px); line-height: 1.3; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--ink-soft); font-size: 16px; line-height: 1.6; }
  .actions { display: flex; gap: 14px; justify-content: center; align-items: center; min-height: 64px; flex-wrap: wrap; }
  button {
    font-family: var(--font-display); font-weight: 500; font-size: 18px; border: 0; cursor: pointer;
    border-radius: 999px; padding: 14px 32px; line-height: 1;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #yes { background: var(--yes); color: var(--yes-ink); transition: transform .2s ease; }
  #yes:hover { transform: scale(1.05); }
  #no { background: var(--no); color: var(--no-ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  #no.free { position: fixed; z-index: 5; transition: left .25s ease, top .25s ease; }
  .count { font-size: 13px; color: var(--ink-soft); min-height: 1.4em; }
  .done { display: grid; gap: 16px; justify-items: center; width: min(560px, 100%); }
  .photo { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px; animation: pop .5s ease; }
  @keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .photo { animation: none; } }
  @media (prefers-reduced-motion: reduce) { #no.free, #yes { transition: none; } }
</style>
</head>

  <h1>รับข้อเสนอนี้ไหม?</h1>

    <button type="button" id="yes">รับ</button>
    <button type="button" id="no">ไม่รับ</button>
  </div>
  <div class="count" id="count" aria-live="polite"></div>

  <h1>น่ารักจังเรยยยย</h1>
  <p id="doneText">รู้อยู่ว่ารักเค้าหมือนกัน</p>
  <button type="button" id="again" style="background:var(--no);color:var(--no-ink)">เริ่มใหม่</button>
</main>

<script>
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const count = document.getElementById('count');
  const lines = ['ไม่รับ', 'แน่ใจเหรอ?', 'จับไม่ได้หรอก', 'ลองใหม่สิ', 'กดรับเถอะ', 'ไม่มีทาง', 'หนีก่อนนะ', 'เหนื่อยยัง?'];
  let dodges = 0, lastDodge = 0;
  const COOLDOWN = 450; // ms ต่อการหนี 1 ครั้ง ป้องกันข้อความเปลี่ยนรัวๆ

  function dodge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    const now = Date.now();
    if (now - lastDodge < COOLDOWN) return;
    lastDodge = now;
    const r = no.getBoundingClientRect();
    if (!no.classList.contains('free')) {
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      no.classList.add('free');
    }
    const pad = 16, w = r.width, h = r.height;
    const maxX = window.innerWidth - w - pad, maxY = window.innerHeight - h - pad;
    const y = yes.getBoundingClientRect();
    let x, t, tries = 0;
    do {
      x = pad + Math.random() * Math.max(0, maxX - pad);
      t = pad + Math.random() * Math.max(0, maxY - pad);
      tries++;
      var farFromOld = Math.hypot(x - r.left, t - r.top) > 120;
      var overYes = x < y.right + 12 && x + w > y.left - 12 && t < y.bottom + 12 && t + h > y.top - 12;
    } while ((!farFromOld || overYes) && tries < 40);
    no.style.left = x + 'px'; no.style.top = t + 'px';
    dodges++;
    no.textContent = lines[dodges % lines.length];
    yes.style.transform = 'scale(' + Math.min(1 + dodges * 0.06, 1.6) + ')';
    count.textContent = 'พยายามกด "ไม่รับ" ไปแล้ว ' + dodges + ' ครั้ง';
  }

  ['pointerenter', 'pointerdown', 'touchstart', 'mousedown', 'click', 'focus'].forEach(ev =>
    no.addEventListener(ev, dodge, { passive: false }));
  no.addEventListener('keydown', dodge);

  // ถ้าเมาส์เข้าใกล้ในระยะ 60px ก็หนีก่อน
  document.addEventListener('pointermove', e => {
    if (document.getElementById('ask').hidden) return;
    const r = no.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 60) dodge();
  });

  window.addEventListener('resize', () => { if (no.classList.contains('free')) dodge(); });

  yes.addEventListener('click', () => {
    document.getElementById('ask').hidden = true;
    no.hidden = true;
    document.getElementById('doneText').textContent = dodges
      ? 'หนีปุ่ม "ไม่รับ" ไป ' + dodges + ' ครั้ง สุดท้ายก็ต้องกดรับอยู่ดี'
      : 'ตอบเร็วมาก รู้อยู่แล้วว่าต้องรับ';
    document.getElementById('done').hidden = false;
  });

  document.getElementById('again').addEventListener('click', () => {
    dodges = 0; count.textContent = ''; no.textContent = 'ไม่รับ';
    no.classList.remove('free'); no.style.left = no.style.top = ''; no.hidden = false;
    yes.style.transform = '';
    document.getElementById('done').hidden = true;
    document.getElementById('ask').hidden = false;
  });
</script>
</body>
</html>
